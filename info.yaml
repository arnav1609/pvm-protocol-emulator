# Tiny Tapeout project information
project:
  title:        "PVM - Programmable & Verifiable Protocol Machine"      # Project title
  author:       "Arnav Bhandari"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Reprogrammable protocol emulator ASIC with a PIO-style engine, pin fabric, and passive timing monitor"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "8x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_arnav1609_pvm"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "pvm_top.v"
    - "pvm_sync2.v"
    - "pvm_edge.v"
    - "pvm_tick.v"
    - "pvm_presc.v"
    - "pvm_fifo.v"
    - "pvm_crc16.v"
    - "pvm_imem.v"
    - "pvm_spi_byte.v"
    - "pvm_hostif.v"
    - "pvm_cfg.v"
    - "pvm_engine.v"
    - "pvm_fabric.v"
    - "pvm_mon.v"
    - "pvm_pin_guard.v"
    - "pvm_auth.v"
    - "pvm_auth_spi.v"
    - "pvm_auth_rx.v"
    - "pvm_auth_mac.v"
    - "pvm_auth_hash.v"
    - "pvm_auth_policy.v"
    - "pvm_auth_records.v"
    - "pvm_auth_bus.v"
    - "pvm_keccak.v"
    - "pvm_keccak_lane.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "SCK"
  ui[1]: "CS_n"
  ui[2]: "MOSI"
  ui[3]: "P0"
  ui[4]: "P1"
  ui[5]: "P2"
  ui[6]: "P3"
  ui[7]: "P4"

  # Outputs
  uo[0]: "P5"
  uo[1]: "P6"
  uo[2]: "P7"
  uo[3]: "P8"
  uo[4]: "P9"
  uo[5]: "P10"
  uo[6]: "P11"
  uo[7]: "MISO"

  # Bidirectional pins
  uio[0]: "P12"
  uio[1]: "P13"
  uio[2]: "P14"
  uio[3]: "P15"
  uio[4]: "P16"
  uio[5]: "P17"
  uio[6]: "P18"
  uio[7]: "P19"

# Do not change!
yaml_version: 6
